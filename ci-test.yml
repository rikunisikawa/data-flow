# IMPORTANT: This file is created in the root directory to avoid GitHub App permissions issues.
# Please move this file to .github/workflows/ci-test.yml to enable the CI pipeline.
name: CI Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r tests/requirements.txt

      - name: Run linters
        run: |
          ruff check .
          mypy .

      - name: Run tests and check coverage
        run: pytest --cov --cov-fail-under=85
