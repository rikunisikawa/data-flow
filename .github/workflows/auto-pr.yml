name: "Plan and Implement on Issue"
on:
  workflow_dispatch:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  setup_spec_kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install uv (for specify CLI)
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Spec Kit templates if missing (idempotent)
        run: |
          set -euo pipefail
          if [ ! -d "templates" ] || [ ! -d "scripts" ]; then
            uvx --from git+https://github.com/github/spec-kit.git specify init --here --ai gemini --ignore-agent-tools
          else
            echo "Spec Kit templates already present."
          fi

  plan:
    needs: setup_spec_kit
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Plan with Gemini
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background 縺ゅ↑縺溘�Spec Kit縺ｮ繧ｬ繧､繝峨Λ繧､繝ｳ縺ｫ蠕薙≧荳顔ｴ壹�繝ｭ繧ｸ繧ｧ繧ｯ繝医�繝阪�繧ｸ繝｣蜈ｼ繧ｽ繝輔ヨ繧ｦ繧ｧ繧｢繧ｨ繝ｳ繧ｸ繝九い縺ｧ縺吶�
            /background 莉･荳九�Issue繧偵ｂ縺ｨ縺ｫ譁ｰ縺励＞縲梧ｩ溯�縲阪ｒ髢句ｧ九＠縺ｦ縺上□縺輔＞縲�/specify 縺ｫ繧医ｊ莉墓ｧ倥ｒ逕滓�縺励ヾpec Kit 縺ｮ繧ｹ繧ｯ繝ｪ繝励ヨ縺ｧ繝悶Λ繝ｳ繝√→ specs 繝�ぅ繝ｬ繧ｯ繝医Μ繧剃ｽ懈�縺励※縺上□縺輔＞縲�
            /background 縺昴�蠕� /plan 繧貞ｮ溯｡後＠縲∝ｿ�ｦ√↑繧� /tasks 縺ｾ縺ｧ騾ｲ繧√※縺上□縺輔＞��tasks 縺ｯ蠕後〒縺ｧ繧ょ庄�峨�Gemini縺ｮ繝輔ぃ繧､繝ｫ/繧ｷ繧ｧ繝ｫ繝��繝ｫ繧剃ｽｿ縺｣縺ｦ蠢�ｦ√↑繝輔ぃ繧､繝ｫ繧剃ｿ晏ｭ倥＠縺ｦ縺上□縺輔＞縲�
            /background 遖∵ｭ｢莠矩��: `.github/workflows` 驟堺ｸ九�邱ｨ髮�＠縺ｪ縺�Ｓun_shell_command 縺ｧ `$()`, `<()`, `()>` 縺ｮ繧医≧縺ｪ繧ｳ繝槭Φ繝臥ｽｮ謠帙�菴ｿ逕ｨ縺励↑縺��
            /specify
            [Feature] issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            [Context]
            ${{ github.event.issue.body }}
            /plan 縺薙�讖溯�縺ｯ譌｢蟄倥Ξ繝昴ず繝医Μ縺ｫ谿ｵ髫守噪縺ｫ霑ｽ蜉�縺励∪縺吶ら樟陦後�繧ｹ繧ｿ繝�け/隕冗ｴ�→謨ｴ蜷医＠縲√ユ繧ｹ繝域婿驥昴→蠖ｱ髻ｿ遽�峇繧ょ性繧√※險育判縺励※縺上□縺輔＞縲�

      - name: Persist generated spec/plan (commit if any)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(spec-kit): persist generated spec/plan"
          else
            echo "No changes from Gemini step."
          fi

      - name: Debug specs tree
        run: |
          set -euo pipefail
          ls -la
          if [ -d specs ]; then
            echo "== specs =="
            ls -la specs || true
            echo "== newest spec.md =="
            SPEC_DIR="$(ls -1d specs/* 2>/dev/null | sort | tail -n1 || true)"
            [ -n "${SPEC_DIR}" ] && sed -n '1,80p' "${SPEC_DIR}/spec.md" || true
          fi

      - name: Detect or create spec dir and branch (robust)
        id: detect_spec
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${{ github.event.issue.number }}"
          DEFAULT_BRANCH="feature/issue-${ISSUE_NUMBER}"

          SPEC_DIR="$(ls -1d specs/* 2>/dev/null | sort | tail -n1 || true)"

          if [ -z "${SPEC_DIR}" ]; then
            TS="$(date +%Y%m%d-%H%M%S)"
            SPEC_DIR="specs/${TS}-issue-${ISSUE_NUMBER}"
            mkdir -p "${SPEC_DIR}"
            cat > "${SPEC_DIR}/spec.md" <<'EOF'
          Spec

          Title: (auto-created spec)
          Feature Branch: `REPLACE_ME`

          Context

          (縺薙� spec 縺ｯ繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ縺ｨ縺励※閾ｪ蜍慕函謌舌＆繧後∪縺励◆縲�Gemini 螳溯｡後〒荳頑嶌縺阪＆繧後※繧よｧ九＞縺ｾ縺帙ｓ)
          EOF
            sed -i "s/REPLACE_ME/${DEFAULT_BRANCH}/" "${SPEC_DIR}/spec.md"
            touch "${SPEC_DIR}/plan.md"
            echo "Created fallback spec at ${SPEC_DIR}"
          fi

          SPEC_MD="${SPEC_DIR}/spec.md"
          if [ -f "${SPEC_MD}" ]; then
            BRANCH_NAME="$(grep -m1 -E '^Feature Branch:' "${SPEC_MD}" | awk -F'`' '{print $2}' || true)"
          else
            BRANCH_NAME=""
          fi
          if [ -z "${BRANCH_NAME}" ]; then
            BRANCH_NAME="${DEFAULT_BRANCH}"
            echo "Feature Branch not found in ${SPEC_MD}. Fallback to ${BRANCH_NAME}"
          fi

          echo "spec_dir=${SPEC_DIR}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit & push spec/plan/tasks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.detect_spec.outputs.branch_name }}" || git switch "${{ steps.detect_spec.outputs.branch_name }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "spec: initialize ${{ steps.detect_spec.outputs.branch_name }} for issue #${{ github.event.issue.number }}"
          fi
          git push -u origin "${{ steps.detect_spec.outputs.branch_name }}"

      - name: Create PR for Spec/Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="${{ steps.detect_spec.outputs.branch_name }}"
          BODY_FILE="$(mktemp)"
          {
            printf "%s
" "This PR bootstraps Spec/Plan for issue #${{ github.event.issue.number }} using Spec Kit."
            printf "
- Spec dir:
`%s`
" "${{ steps.detect_spec.outputs.spec_dir }}"
            printf "
- Branch:
`%s`
" "${{ steps.detect_spec.outputs.branch_name }}"
            printf "
谺｡縺ｮ繧ｹ繝�ャ繝�: 霑ｽ險倥ｄ菫ｮ豁｣縺ｯ繧ｳ繝｡繝ｳ繝医〒縲ょｮ溯｣�ｒ騾ｲ繧√ｋ蝣ｴ蜷医� Issue 繧� PR 縺ｫ /execute 縺ｨ繧ｳ繝｡繝ｳ繝医＠縺ｦ縺上□縺輔＞縲�
"
          } > "$BODY_FILE"

          if gh pr view --head "$BR" --json number -q .number >/dev/null 2>&1; then
            gh pr edit --head "$BR" --title "Spec: ${BR} for issue #${{ github.event.issue.number }}" --body-file "$BODY_FILE"
          else
            gh pr create               --title "Spec: ${BR} for issue #${{ github.event.issue.number }}"               --body-file "$BODY_FILE"               --base main               --head "$BR"               --label "spec-kit,plan"
          fi