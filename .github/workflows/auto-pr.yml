name: "Plan and Implement on Issue"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  plan:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write # PR作成のために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Plan with Gemini
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたは優秀なプロジェクトマネージャー兼ソフトウェアエンジニアです。
            以下のIssueの内容を分析し、具体的な実装計画を作成してください。
            計画はマークダウン形式で、`write_file`ツールを呼び出して `.github/plans/issue-${{ github.event.issue.number }}.md` というファイルに保存してください。

            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

      - name: Create and push plan branch
        id: git_work
        run: |
          set -e
          BRANCH_NAME="feature/issue-${{ github.event.issue.number }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Branch $BRANCH_NAME already exists."
            exit 0
          fi

          git switch -c "$BRANCH_NAME"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(plan): create plan for issue #${{ github.event.issue.number }}"
            git push -u origin "$BRANCH_NAME"
          else
            echo "No plan file was created by Gemini. Exiting."
            exit 1
          fi

      - name: Create Pull Request for Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.git_work.outputs.branch_name }}
        run: |
          if gh pr view "$BRANCH_NAME" --json number -q . >/dev/null 2>&1; then
            echo "PR already exists for branch $BRANCH_NAME"
          else
            gh pr create \
              --title "Plan: Implementation plan for issue #${{ github.event.issue.number }}" \
              --body "This PR contains the implementation plan for issue #${{ github.event.issue.number }}.\n\nPlease review the plan. To proceed with implementation, comment \`/execute\` on the issue with any additional instructions." \
              --base main \
              --head "$BRANCH_NAME" \
              --label "plan"
          fi

  implement:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine issue number and branch name
        id: get_branch
        run: |
          ISSUE_NUMBER=""
          BRANCH_NAME=""

          # If the comment is on a PR
          if [[ -n "${{ github.event.issue.pull_request }}" ]]; then
            # Get the branch name from the PR
            PR_NUMBER=${{ github.event.issue.number }}
            BRANCH_NAME=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)

            # Extract the issue number from the branch name (e.g., feature/issue-123 -> 123)
            if [[ "$BRANCH_NAME" =~ ^feature/issue-([0-9]+)$ ]]; then
              ISSUE_NUMBER="${BASH_REMATCH[1]}"
            else
              echo "Could not extract issue number from branch name: $BRANCH_NAME"
              exit 1
            fi
          # If the comment is directly on an issue
          else
            ISSUE_NUMBER=${{ github.event.issue.number }}
            BRANCH_NAME="feature/issue-$ISSUE_NUMBER"
          fi

          if [[ -z "$ISSUE_NUMBER" || -z "$BRANCH_NAME" ]]; then
            echo "Failed to determine issue number or branch name."
            exit 1
          fi

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get_branch.outputs.branch_name }}
          fetch-depth: 0

      - name: Read plan file
        id: read_plan
        run: |
          PLAN_FILE=".github/plans/issue-${{ steps.get_branch.outputs.issue_number }}.md"
          if [ ! -f "$PLAN_FILE" ]; then
            echo "Plan file not found."
            echo "content=Plan file not found. Proceeding with issue title and body only." >> $GITHUB_OUTPUT
          else
            content=$(cat $PLAN_FILE)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "content<<$EOF" >> $GITHUB_OUTPUT
            echo "$content" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run Gemini CLI for implementation
        id: gemini_implement
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたはプロのソフトウェアエンジニアです。以下のIssue、最新のコメント、そして承認された計画に基づき、必要なすべてのコード変更を行ってください。
            コード変更が完了したら、以下の区切り線を使って、この変更を説明するPull Requestのタイトル、本文、そしてコミットメッセージを生成してください。

            **重要**: `.github/workflows`ディレクトリ内のファイルは絶対に編集しないでください。

            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            Latest Comment: ${{ github.event.comment.body }}
            
            Approved Plan:
            ${{ steps.read_plan.outputs.content }}

            ---PR_TITLE---
            [ここにPRのタイトルを記述。必ず "issue #${{ steps.get_branch.outputs.issue_number }}" を含めてください]
            ---PR_BODY---
            [ここにPRの本文を記述。変更内容の全体像がわかるようにまとめてください。]
            ---COMMIT_MESSAGE---
            [ここに機能変更を要約したコミットメッセージを記述]

      - name: Extract PR info or set fallback
        id: extract_pr_info
        run: |
          gemini_output="${{ steps.gemini_implement.outputs.result }}"
          
          pr_title=$(echo "$gemini_output" | awk '/---PR_TITLE---/{flag=1; next} /---PR_BODY---/{flag=0} flag' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          pr_body=$(echo "$gemini_output" | awk '/---PR_BODY---/{flag=1; next} /---COMMIT_MESSAGE---/{flag=0} flag')
          commit_message=$(echo "$gemini_output" | awk '/---COMMIT_MESSAGE---/{flag=1; next} flag')

          if [ -z "$pr_title" ]; then pr_title="feat: implement issue #${{ steps.get_branch.outputs.issue_number }}"; fi
          if [ -z "$pr_body" ]; then pr_body="Auto-generated PR for issue #${{ steps.get_branch.outputs.issue_number }}.\n\n**Comment:**\n${{ github.event.comment.body }}"; fi
          if [ -z "$commit_message" ]; then commit_message="feat: implement issue #${{ steps.get_branch.outputs.issue_number }} based on comment"; fi
          
          echo "pr_title=$(echo "$pr_title" | head -n 1)" >> $GITHUB_OUTPUT
          EOF_BODY=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "pr_body<<$EOF_BODY" >> $GITHUB_OUTPUT
          echo "$pr_body" >> $GITHUB_OUTPUT
          echo "$EOF_BODY" >> $GITHUB_OUTPUT
          EOF_COMMIT=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "commit_message<<$EOF_COMMIT" >> $GITHUB_OUTPUT
          echo "$commit_message" >> $GITHUB_OUTPUT
          echo "$EOF_COMMIT" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "${{ steps.extract_pr_info.outputs.commit_message }}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.get_branch.outputs.branch_name }}"
          PR_TITLE="${{ steps.extract_pr_info.outputs.pr_title }}"
          PR_BODY="${{ steps.extract_pr_info.outputs.pr_body }}"

          # Find the PR number associated with the branch
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Could not find a PR for branch $BRANCH_NAME. Creating a new one."
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH_NAME" \
              --label "auto-generated,plan-approved"
          else
            echo "Updating PR #$PR_NUMBER with title: $PR_TITLE"
            gh pr edit "$PR_NUMBER" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi