name: "Plan and Implement on Issue"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  plan:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Plan with Gemini
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたは優秀なプロジェクトマネージャー兼ソフトウェアエンジニアです。
            以下のIssueの内容を分析し、具体的な実装計画を作成してください。
            計画はマークダウン形式で、`.github/plans/issue-${{ github.event.issue.number }}.md` というファイルに保存してください。

            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

      - name: Create and push plan branch
        id: git_work
        run: |
          set -e
          BRANCH_NAME="feature/issue-${{ github.event.issue.number }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Branch $BRANCH_NAME already exists."
            exit 0
          fi

          git switch -c "$BRANCH_NAME"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(plan): create plan for issue #${{ github.event.issue.number }}"
            git push -u origin "$BRANCH_NAME"
          else
            echo "No plan file was created by Gemini. Exiting."
            exit 1
          fi

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.git_work.outputs.branch_name }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Plan has been created in branch \`$BRANCH_NAME\`. Please review the plan and comment \`/execute\` to proceed with implementation."

  implement:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Determine issue number and branch name
        id: get_branch
        run: |
          # Default to the issue number from the event
          TARGET_NUMBER=${{ github.event.issue.number }}
          
          # If the comment is on a PR, get the issue number from the PR title
          if [[ -n "${{ github.event.issue.pull_request }}" ]]; then
            # Get the issue number from the PR title (assuming format like '... #123')
            ISSUE_NUMBER=$(gh pr view "$TARGET_NUMBER" --json title -q .title | grep -oE '#[0-9]+' | tr -d '#')
            if [[ -z "$ISSUE_NUMBER" ]]; then
              echo "Could not extract issue number from PR title."
              # Fallback to the headRefName just in case, but this is not ideal
              BRANCH_NAME=$(gh pr view "$TARGET_NUMBER" --json headRefName -q .headRefName)
              echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
              echo "issue_number=" >> $GITHUB_OUTPUT # No issue number
              exit 0
            fi
          else
            ISSUE_NUMBER=$TARGET_NUMBER
          fi

          BRANCH_NAME="feature/issue-$ISSUE_NUMBER"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get_branch.outputs.branch_name }}
          fetch-depth: 0

      - name: Read plan file
        id: read_plan
        run: |
          ISSUE_NUMBER=${{ steps.get_branch.outputs.issue_number }}
          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "Issue number not found, cannot read plan file."
            echo "content=Issue number not found. Proceeding with issue title and body only." >> $GITHUB_OUTPUT
          else
            PLAN_FILE=".github/plans/issue-$ISSUE_NUMBER.md"
            if [ ! -f "$PLAN_FILE" ]; then
              echo "Plan file not found."
              echo "content=Plan file not found. Proceeding with issue title and body only." >> $GITHUB_OUTPUT
            else
              content=$(cat $PLAN_FILE)
              EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
              echo "content<<$EOF" >> $GITHUB_OUTPUT
              echo "$content" >> $GITHUB_OUTPUT
              echo "$EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Gemini CLI for implementation
        id: gemini_implement
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたはプロのソフトウェアエンジニアです。以下のIssueと承認された計画に基づき、必要なすべてのコード変更（新規作成、修正、削除など）を行ってください。
            コード変更が完了したら、以下の区切り線を使って、この変更を説明するPull Requestのタイトル、本文、そしてコミットメッセージを生成してください。

            **重要**: `.github/workflows`ディレクトリ内のファイルは絶対に編集しないでください。
            **重要**: Geminiで行った実装内容と理由を`.github/YYYYMMDD_feature/issue-XXX.md`としてMarkdownで記録してください。

            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            
            Approved Plan:
            ${{ steps.read_plan.outputs.content }}

            ---PR_TITLE---
            [ここにPRのタイトルを記述。必ず "issue #${{ steps.get_branch.outputs.issue_number }}" を含めてください]
            ---PR_BODY---
            [ここにPRの本文を記述。変更内容の全体像がわかるようにまとめてください。]
            ---COMMIT_MESSAGE---
            [ここに機能変更を要約したコミITメッセージを記述]

      - name: Extract PR info or set fallback
        id: extract_pr_info
        run: |
          gemini_output="${{ steps.gemini_implement.outputs.result }}"
          
          pr_title=$(echo "$gemini_output" | awk '/---PR_TITLE---/{flag=1; next} /---PR_BODY---/{flag=0} flag' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          pr_body=$(echo "$gemini_output" | awk '/---PR_BODY---/{flag=1; next} /---COMMIT_MESSAGE---/{flag=0} flag')
          commit_message=$(echo "$gemini_output" | awk '/---COMMIT_MESSAGE---/{flag=1; next} flag')

          if [ -z "$pr_title" ]; then pr_title="feat: implement issue #${{ steps.get_branch.outputs.issue_number }}"; fi
          if [ -z "$pr_body" ]; then pr_body="Auto-generated PR for issue #${{ steps.get_branch.outputs.issue_number }}."; fi
          if [ -z "$commit_message" ]; then commit_message="feat: implement issue #${{ steps.get_branch.outputs.issue_number }}"; fi
          
          echo "pr_title=$(echo "$pr_title" | head -n 1)" >> $GITHUB_OUTPUT
          EOF_BODY=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "pr_body<<$EOF_BODY" >> $GITHUB_OUTPUT
          echo "$pr_body" >> $GITHUB_OUTPUT
          echo "$EOF_BODY" >> $GITHUB_OUTPUT
          EOF_COMMIT=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "commit_message<<$EOF_COMMIT" >> $GITHUB_OUTPUT
          echo "$commit_message" >> $GITHUB_OUTPUT
          echo "$EOF_COMMIT" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "${{ steps.extract_pr_info.outputs.commit_message }}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.get_branch.outputs.branch_name }}
          PR_TITLE: ${{ steps.extract_pr_info.outputs.pr_title }}
          PR_BODY: ${{ steps.extract_pr_info.outputs.pr_body }}
        run: |
          if gh pr view "$BRANCH_NAME" --json number -q . >/dev/null 2>&1; then
            echo "PR already exists for branch $BRANCH_NAME"
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH_NAME" \
              --label "auto-generated,plan-approved"
          fi
