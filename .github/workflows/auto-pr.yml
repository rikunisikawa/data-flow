name: "Plan and Implement on Issue"
on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: auto-pr-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  setup_spec_kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install uv (for specify CLI)
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Spec Kit templates if missing (idempotent)
        run: |
          set -euo pipefail
          if [ ! -d "templates" ] || [ ! -d "scripts" ]; then
            uvx --from git+https://github.com/github/spec-kit.git specify init --here --ai gemini --ignore-agent-tools
          else
            echo "Spec Kit templates already present."
          fi

  plan:
    needs: setup_spec_kit
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Plan with Gemini
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたはSpec Kitを用いて仕様・計画を生成するAIです。出力は必ず日本語で行ってください（コードや識別子は英語可）。
            /background 次のIssueを読み取り、Spec Kitの構成に従って`specs/`配下へ仕様(`spec.md`)と計画(`plan.md`)、必要に応じてタスク(`tasks.md`)を生成します。
            /background 制約: `.github/workflows` ディレクトリは編集しないこと。`run_shell_command`使用時は`$()`, `<()`, `>()`のコマンド置換を使わないこと。
            /specify
            [Feature] issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            [Context]
            ${{ github.event.issue.body }}
            /plan 高レベルの実装計画を日本語で簡潔に列挙し、依存関係が分かるように順序立ててください。
            /tasks 実装タスクを日本語で具体的に列挙し、成果物のパスや検証方法（テスト/動作確認）を明記してください。

      - name: Persist generated spec/plan (commit if any)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(spec-kit): persist generated spec/plan"
          else
            echo "No changes from Gemini step."
          fi

      - name: Debug specs tree
        run: |
          set -euo pipefail
          ls -la
          if [ -d specs ]; then
            echo "== specs =="
            ls -la specs || true
            echo "== newest spec.md =="
            SPEC_DIR="$(ls -1d specs/* 2>/dev/null | sort | tail -n1 || true)"
            [ -n "${SPEC_DIR}" ] && sed -n '1,80p' "${SPEC_DIR}/spec.md" || true
          fi

      - name: Detect or create spec dir and branch (robust)
        id: detect_spec
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${{ github.event.issue.number }}"
          DEFAULT_BRANCH="feature/issue-${ISSUE_NUMBER}"

          SPEC_DIR="$(ls -1d specs/* 2>/dev/null | sort | tail -n1 || true)"

          if [ -z "${SPEC_DIR}" ]; then
            TS="$(date +%Y%m%d-%H%M%S)"
            SPEC_DIR="specs/${TS}-issue-${ISSUE_NUMBER}"
            mkdir -p "${SPEC_DIR}"
            cat > "${SPEC_DIR}/spec.md" <<'EOF'
          Spec

          Title: (auto-created spec)
          Feature Branch: `REPLACE_ME`

          Context

          (自動生成された初期specです。Geminiにより後続の計画/タスク作成で更新されます。)
          EOF
            sed -i "s/REPLACE_ME/${DEFAULT_BRANCH}/" "${SPEC_DIR}/spec.md"
            touch "${SPEC_DIR}/plan.md"
            echo "Created fallback spec at ${SPEC_DIR}"
          fi

          SPEC_MD="${SPEC_DIR}/spec.md"
          if [ -f "${SPEC_MD}" ]; then
            BRANCH_NAME="$(grep -m1 -E '^Feature Branch:' "${SPEC_MD}" | awk -F'`' '{print $2}' || true)"
          else
            BRANCH_NAME=""
          fi
          if [ -z "${BRANCH_NAME}" ]; then
            BRANCH_NAME="${DEFAULT_BRANCH}"
            echo "Feature Branch not found in ${SPEC_MD}. Fallback to ${BRANCH_NAME}"
          fi

          echo "spec_dir=${SPEC_DIR}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit & push spec/plan/tasks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.detect_spec.outputs.branch_name }}" || git switch "${{ steps.detect_spec.outputs.branch_name }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "spec: initialize ${{ steps.detect_spec.outputs.branch_name }} for issue #${{ github.event.issue.number }}"
          fi
          git push -u origin "${{ steps.detect_spec.outputs.branch_name }}"

      - name: Ensure PR labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1"; local color="$2"; local desc="$3";
            if ! gh label list --json name -q '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --color "$color" --description "$desc"
            else
              echo "Label $name already exists"
            fi
          }
          ensure_label "spec-kit" "0366d6" "Spec Kit generated"
          ensure_label "plan" "0e8a16" "Planning PR"

      - name: Create PR for Spec/Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="${{ steps.detect_spec.outputs.branch_name }}"
          BODY_FILE="$(mktemp)"
          {
            echo "This PR bootstraps Spec/Plan for issue #${{ github.event.issue.number }} using Spec Kit."
            echo
            echo "- Spec dir:"
            echo "\`${{ steps.detect_spec.outputs.spec_dir }}\`"
            echo
            echo "- Branch:"
            echo "\`${{ steps.detect_spec.outputs.branch_name }}\`"
            echo
            echo "次のアクション: 計画をご確認ください。実装フローを進める場合は、PR上で指示コメントを残してください（例: 補足要件や制約の追記）。"
          } > "$BODY_FILE"

          if gh pr view --head "$BR" --json number -q .number >/dev/null 2>&1; then
            gh pr edit --head "$BR" --title "Spec: ${BR} for issue #${{ github.event.issue.number }}" --body-file "$BODY_FILE"
          else
            gh pr create \
              --title "Spec: ${BR} for issue #${{ github.event.issue.number }}" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BR" \
              --label spec-kit \
              --label plan
          fi

  implement:
    if: contains(github.event.comment.body, '/execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine issue number and branch name
        id: get_branch
        run: |
          set -e
          ISSUE_NUMBER=""
          BRANCH_NAME=""

          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            # PRレビューコメントの場合
            PR_NUMBER=${{ github.event.pull_request.number }}
            BRANCH_NAME=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
            if [[ "$BRANCH_NAME" =~ ^feature/issue-([0-9]+)$ ]]; then
              ISSUE_NUMBER="${BASH_REMATCH[1]}"
            else
              echo "Could not extract issue number from branch name (PR review comment): $BRANCH_NAME"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # Issueコメント（Issue or PR）
            if [[ -n "${{ github.event.issue.pull_request }}" ]]; then
              # PR上のコメント
              PR_NUMBER=${{ github.event.issue.number }}
              BRANCH_NAME=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
              if [[ "$BRANCH_NAME" =~ ^feature/issue-([0-9]+)$ ]]; then
                ISSUE_NUMBER="${BASH_REMATCH[1]}"
              else
                echo "Could not extract issue number from branch name (PR comment): $BRANCH_NAME"
                exit 1
              fi
            else
              # 純粋なIssue上のコメント
              ISSUE_NUMBER=${{ github.event.issue.number }}
              BRANCH_NAME="feature/issue-$ISSUE_NUMBER"
            fi
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 1
          fi

          if [[ -z "$ISSUE_NUMBER" || -z "$BRANCH_NAME" ]]; then
            echo "Failed to determine issue number or branch name."
            exit 1
          fi

          {
            echo "branch_name=$BRANCH_NAME"
            echo "issue_number=$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_branch.outputs.branch_name }}
          fetch-depth: 0

      - name: Read plan file
        id: read_plan
        run: |
          set -e
          PLAN_FILE=".github/plans/issue-${{ steps.get_branch.outputs.issue_number }}.md"
          EOF_KEY=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

          if [ ! -f "$PLAN_FILE" ]; then
            {
              echo "content<<$EOF_KEY"
              echo "Plan file not found. Proceeding with issue title and body only."
              echo "$EOF_KEY"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "content<<$EOF_KEY"
              cat "$PLAN_FILE"
              echo "$EOF_KEY"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini CLI for implementation
        id: gemini_implement
        uses: google-gemini/gemini-cli-action@main
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            /background あなたはプロのソフトウェアエンジニアです。以下のIssue、最新のコメント、そして承認された計画に基づき、必要なすべてのコード変更を行ってください。出力は必ず日本語で記述してください（コード/識別子は英語可）。
            コメントはIssue、PR、レビューコメントいずれの場合も反映してください。
            コード変更が完了したら、以下の区切り線を使って、この変更を説明するPull Requestのタイトル、本文、そしてコミットメッセージを生成してください。

            **重要**: `.github/workflows`ディレクトリ内のファイルは絶対に編集しないでください。
            **重要**: `run_shell_command`ツールを使用する際は、セキュリティ上の理由から、`$()`、`<()`、`>()`のようなコマンド置換は使用しないでください。

            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            Latest Comment: ${{ github.event.comment.body }}

            Approved Plan:
            ${{ steps.read_plan.outputs.content }}

            ---PR_TITLE---
            [ここにPRのタイトルを記述。必ず "issue #${{ steps.get_branch.outputs.issue_number }}" を含めてください]
            ---PR_BODY---
            [ここにPRの本文を記述。変更内容の全体像がわかるようにまとめてください。]
            ---COMMIT_MESSAGE---
            [ここに機能変更を要約したコミットメッセージを記述]

      - name: Extract PR info or set fallback
        id: extract_pr_info
        env:
          FALLBACK_PR_BODY: |
            Auto-generated PR for issue #${{ steps.get_branch.outputs.issue_number }}.

            **Comment:**
            ${{ github.event.comment.body }}
        run: |
          set -e
          gemini_output="${{ steps.gemini_implement.outputs.result }}"

          pr_title=$(echo "$gemini_output" | awk '/---PR_TITLE---/{flag=1; next} /---PR_BODY---/{flag=0} flag' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          pr_body=$(echo "$gemini_output" | awk '/---PR_BODY---/{flag=1; next} /---COMMIT_MESSAGE---/{flag=0} flag')
          commit_message=$(echo "$gemini_output" | awk '/---COMMIT_MESSAGE---/{flag=1; next} flag')

          # Fallback safely (no shell interpolation)
          if [ -z "$pr_title" ]; then
            pr_title="feat: implement issue #${{ steps.get_branch.outputs.issue_number }}"
          fi

          if [ -z "$pr_body" ]; then
            pr_body="$FALLBACK_PR_BODY"
          fi

          if [ -z "$commit_message" ]; then
            commit_message="feat: implement issue #${{ steps.get_branch.outputs.issue_number }} based on comment"
          fi

          echo "pr_title=$(echo "$pr_title" | head -n 1)" >> "$GITHUB_OUTPUT"

          EOF_BODY=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "pr_body<<$EOF_BODY"
            printf '%s\n' "$pr_body"
            echo "$EOF_BODY"
          } >> "$GITHUB_OUTPUT"

          EOF_COMMIT=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "commit_message<<$EOF_COMMIT"
            printf '%s\n' "$commit_message"
            echo "$EOF_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "${{ steps.extract_pr_info.outputs.commit_message }}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          BRANCH_NAME="${{ steps.get_branch.outputs.branch_name }}"
          PR_TITLE="${{ steps.extract_pr_info.outputs.pr_title }}"

          BODY_FILE="$(mktemp)"
          printf '%s' "${{ steps.extract_pr_info.outputs.pr_body }}" > "$BODY_FILE"

          PR_NUMBER="$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number' || true)"

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Could not find a PR for branch $BRANCH_NAME. Creating a new one."
            gh pr create --title "$PR_TITLE" --body-file "$BODY_FILE" --base main --head "$BRANCH_NAME" --label auto-generated --label plan-approved
          else
            echo "Updating PR #$PR_NUMBER with title: $PR_TITLE"
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file "$BODY_FILE"
          fi
