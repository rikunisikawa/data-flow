name: Terraform Deploy (Permissions First)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'download_and_upload/**'
      - 'convert_log_to_parquet/**'
      - 'layer/**'
      - 'build.sh'

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::143944071087:role/GitHubActionsTerraformDeployRole
          aws-region: ap-northeast-1

      - name: Build Lambda Deployment Packages
        run: bash build.sh prod

      - name: Terraform Apply (IAM First)
        run: |
          cd terraform
          docker compose build
          docker compose run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION \
            -e AWS_REGION \
            terraform sh -c "\
              terraform init -reconfigure && \
              (terraform workspace select prod || terraform workspace new prod) && \
              terraform apply -auto-approve -var-file=prod.tfvars \
                -target=aws_iam_role_policy.github_actions_terraform_deploy_policy \
                -target=aws_iam_role_policy.sfn_execution_policy"

      - name: Terraform Apply (All)
        run: |
          cd terraform
          docker compose run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION \
            -e AWS_REGION \
            terraform sh -c "\
              terraform apply -auto-approve -var-file=prod.tfvars"
