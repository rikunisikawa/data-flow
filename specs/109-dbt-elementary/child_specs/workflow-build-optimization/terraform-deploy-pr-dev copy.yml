name: Terraform Deploy (PR -> dev)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'download_and_upload/**'
      - 'convert_log_to_parquet/**'
      - 'layer/**'
      - 'build.sh'
      - 'docker/dbt/**'
      - 'dbt_profiles/**'
      - 'scripts/build_dbt_image.sh'

jobs:
  deploy-dev:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::143944071087:role/GitHubActionsTerraformDeployRole
          aws-region: ap-northeast-1

      - name: Cache Lambda Build Artifacts
        id: lambda_build_cache
        uses: actions/cache@v4
        with:
          path: build
          key: lambda-build-${{ runner.os }}-${{ hashFiles('build.sh', 'layer/**', 'download_and_upload/**', 'convert_log_to_parquet/**') }}

      - name: Decide Lambda Build
        id: lambda_build_needed
        run: |
          if [ "${{ steps.lambda_build_cache.outputs.cache-hit }}" != "true" ] || [ ! -f build/layer.zip ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Lambda Deployment Packages
        if: steps.lambda_build_needed.outputs.run_build == 'true'
        run: bash build.sh dev

      - name: Build and Push dbt Image
        env:
          DBT_IMAGE_TAG: dev-latest
        run: |
          bash scripts/build_dbt_image.sh dev "${DBT_IMAGE_TAG}"
          echo "DBT_IMAGE_TAG=${DBT_IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Terraform Apply (IAM First)
        run: |
          cd terraform
          docker compose build
          docker compose run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION \
            -e AWS_REGION \
            terraform sh -c "\
              terraform init -reconfigure && \
              (terraform workspace select dev || terraform workspace new dev) && \
              terraform apply -auto-approve -var-file=dev.tfvars \
                -target=aws_iam_role_policy.github_actions_terraform_deploy_policy \
                -target=aws_iam_role_policy.sfn_execution_policy"

      - name: Terraform Apply (All)
        run: |
          cd terraform
          docker compose run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION \
            -e AWS_REGION \
            terraform sh -c "\
              terraform apply -auto-approve -var-file=dev.tfvars"
