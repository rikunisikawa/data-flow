AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  aws-data-platform

  SAM template for the data processing pipeline.

Parameters:
  KaggleUsername:
    Type: String
    Description: Kaggle Username
  KaggleKey:
    Type: String
    Description: Kaggle Key
  BucketName:
    Type: String
    Default: aws-data-platform-20250607
    Description: S3 bucket for the data pipeline

Globals:
  Function:
    Timeout: 300

Resources:
  DownloadAndUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: download_and_upload/
      Handler: download_and_upload.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
          KAGGLE_USERNAME: !Ref KaggleUsername
          KAGGLE_KEY: !Ref KaggleKey
      Layers:
        - !Ref KaggleApiLayer
      MemorySize: 1024

  ConvertLogToParquetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: convert_log_to_parquet/
      Handler: convert_log_to_parquet.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
      Layers:
        - !Ref KaggleApiLayer
      MemorySize: 1024

  DataProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: state_machine/data_processing.asl.json
      DefinitionSubstitutions:
        DownloadAndUploadFunctionArn: !GetAtt DownloadAndUploadFunction.Arn
        ConvertLogToParquetFunctionArn: !GetAtt ConvertLogToParquetFunction.Arn
        GlueJobName: !Ref MHealthGlueJob
        BucketName: !Ref BucketName
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DownloadAndUploadFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ConvertLogToParquetFunction
        - GlueStartJobRunPolicy:
            JobName: !Ref MHealthGlueJob
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  KaggleApiLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layer/sam
      CompatibleRuntimes:
        - python3.11
      LicenseInfo: MIT
    Metadata:
      BuildMethod: makefile
    Description: Kaggle API dependencies layer

  MHealthGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: mhealth-data-processing-job
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${BucketName}/scripts/glue_job.py"
        PythonVersion: '3'
      DefaultArguments:
        "--job-language": "python"
        "--enable-metrics": ""
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: GlueS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"

Outputs:
  StateMachineArn:
    Description: "Data Processing State Machine ARN"
    Value: !Ref DataProcessingStateMachine