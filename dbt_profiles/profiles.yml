data_flow_dbt:
  target: dev
  outputs:
    dev:
      type: athena
      s3_staging_dir: "{{ env_var('S3_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('S3_DATA_DIR') }}"
      region_name: "{{ env_var('AWS_REGION') }}"
      database: "awsdatacatalog"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      work_group: "{{ env_var('ATHENA_WORK_GROUP', 'primary') }}"
      threads: 4
      poll_interval: 5
